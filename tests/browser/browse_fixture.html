<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Lumen browse fixture</title></head>
  <body>
    <div id="root" class="main"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import BrowsePage from "../../src/pages/BrowsePage.jsx";
      import LibraryPage from "../../src/pages/LibraryPage.jsx";
      import HomePage from "../../src/pages/HomePage.jsx";
      import "../../src/styles/global.css";

      const root = createRoot(document.getElementById("root"));
      const noop = () => {};
      window.actions = [];
      const base = {
        apiKey: "fixture-key", watched: {}, progress: {}, history: [], inProgress: [],
        saved: [], trending: [], trendingTV: [], onSelect: (item) => window.actions.push(item),
        onMarkWatched: (key) => window.actions.push(key), onToggleSave: noop,
      };
      window.mountBrowse = () => root.render(React.createElement(BrowsePage, { ...base, type: "tv" }));
      window.mountLibrary = (props) => root.render(React.createElement(LibraryPage, { ...base, ...props }));
      window.mountHome = (props) => root.render(React.createElement(HomePage, { ...base, ...props }));
    </script>
  </body>
</html>
